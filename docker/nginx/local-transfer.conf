# LAN listener for book file downloads from devices on the same network (see
# docs/LOCAL_TRANSFER.md). The apps trust only this certificate's public key, which
# they learn over APP_URL, so the self-signed certificate generated by entrypoint.sh
# is enough. Everything except downloads and the ping is refused here; the rest of
# the API stays on APP_URL.
server {
    listen 8443 ssl;
    server_name _;
    root /var/www/html/public;

    ssl_certificate     /var/www/html/storage/app/local-tls/cert.pem;
    ssl_certificate_key /var/www/html/storage/app/local-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff";

    location = /api/v1/health/ping {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ ^/api/v1/books/[^/]+/download/.+ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    # FILE_DELIVERY=x-accel-redirect: book files the API has checked are served from here
    # (BOOK_STORAGE_PATH). Internal only; ^~ keeps the regex locations from claiming it.
    location ^~ /_protected_books/ {
        internal;
        alias /data/books/;
    }

    location / {
        return 404;
    }
}
