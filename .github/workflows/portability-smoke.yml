name: Portability Smoke

on:
  pull_request:
    paths:
      - 'config/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/portability-smoke.yml'
      - 'tests/Core/Unit/Services/PortableStorageConfigurationTest.php'
  workflow_dispatch:

jobs:
  portable-configuration:
    name: Portable configuration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, sqlite3, pdo_sqlite, fileinfo, gd
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-xdebug
      - run: php artisan test tests/Core/Unit/Services/PortableStorageConfigurationTest.php
