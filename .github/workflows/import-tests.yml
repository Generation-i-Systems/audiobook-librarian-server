name: Import System Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/Services/BookImportService.php'
      - 'app/Services/BookEnrichmentService.php'
      - 'app/Services/MetadataProcessingService.php'
      - 'app/Services/GoogleBooksApiService.php'
      - 'app/Services/AIBookProcessor.php'
      - 'app/Services/AudioFileAnalyzer.php'
      - 'app/Console/Commands/ImportBooksFromDownloads.php'
      - 'app/Console/Commands/PrepareForReprocessing.php'
      - 'tests/Unit/Services/MetadataExtractionTest.php'
      - 'tests/Unit/Services/AuthorNormalizationTest.php'
      - 'tests/Unit/Import/EnrichmentMergeTest.php'
      - '.github/workflows/import-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/Services/BookImportService.php'
      - 'app/Services/BookEnrichmentService.php'
      - 'app/Services/MetadataProcessingService.php'
      - 'app/Services/GoogleBooksApiService.php'
      - 'app/Services/AIBookProcessor.php'
      - 'app/Services/AudioFileAnalyzer.php'
      - 'app/Console/Commands/ImportBooksFromDownloads.php'
      - 'app/Console/Commands/PrepareForReprocessing.php'
      - 'tests/Unit/Services/MetadataExtractionTest.php'
      - 'tests/Unit/Services/AuthorNormalizationTest.php'
      - 'tests/Unit/Import/EnrichmentMergeTest.php'
      - '.github/workflows/import-tests.yml'

jobs:
  import-regression-tests:
    name: Import System Regression Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, mysql, pdo, pdo_mysql, getid3
          coverage: xdebug

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Database
        run: |
          mysql -h 127.0.0.1 -u root -ppassword -e "CREATE DATABASE IF NOT EXISTS testing;"

      - name: Run Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Run Import Regression Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          echo "🧪 Running Metadata Extraction Tests..."
          php artisan test --filter=MetadataExtractionTest --stop-on-failure
          
          echo "🧪 Running Author Normalization Tests..."
          php artisan test --filter=AuthorNormalizationTest --stop-on-failure
          
          echo "🧪 Running Enrichment Merge Tests..."
          php artisan test --filter=EnrichmentMergeTest --stop-on-failure
          
          echo "✅ All import regression tests passed!"

      - name: Run Full Test Suite (if import tests pass)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test --coverage --min=80

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: import-tests
          name: import-regression-coverage
