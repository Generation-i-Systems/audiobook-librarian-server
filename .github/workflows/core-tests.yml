name: Core/Service Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/Services/**'
      - 'app/Models/**'
      - 'app/Traits/**'
      - 'app/Events/**'
      - 'app/Listeners/**'
      - 'app/Observers/**'
      - 'app/Providers/**'
      - 'database/migrations/**'
      - 'tests/Core/**'
      - '.github/workflows/core-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/Services/**'
      - 'app/Models/**'
      - 'app/Traits/**'
      - 'app/Events/**'
      - 'app/Listeners/**'
      - 'app/Observers/**'
      - 'app/Providers/**'
      - 'database/migrations/**'
      - 'tests/Core/**'

jobs:
  core-tests:
    name: Core Tests - PHP 8.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, sqlite3, pdo_sqlite, fileinfo, gd
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-xdebug

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate application key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Core/Service Tests
        run: php artisan test tests/Core
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
