                  email: "john@example.com"
                  created_at: "2025-01-01T12:00:00Z"
                  updated_at: "2025-01-01T12:00:00Z"
                  is_admin: false
                token: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unauthorized"
                message: "Invalid credentials"
                status_code: 401

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: User ID
        name:
          type: string
          description: User's full name
        email:
          type: string
          format: email
          description: User's email address
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Account last update timestamp
      example:
        id: "123"
        name: "John Doe"
        email: "john@example.com"
        created_at: "2025-01-01T00:00:00.000000Z"
        updated_at: "2025-01-01T00:00:00.000000Z"
        
    Book:
      type: object
      properties:
        id:
          type: string
          description: Book ID
        title:
          type: string
          description: Book title
        author:
          type: string
          description: Author name
        series:
          type: string
          description: Series name
          nullable: true
        seriesIndex:
          type: number
          format: float
          description: Position in series
          nullable: true
        narrator:
          type: string
          description: Narrator name
          nullable: true
        duration:
          type: number
          format: float
          description: Duration in seconds
          nullable: true
        coverPath:
          type: string
          description: Path to cover image
          nullable: true
        genres:
          type: array
          items:
            type: string
          description: List of genres
        description:
          type: string
          description: Book description
          nullable: true
        publishedYear:
          type: integer
          description: Year published
          nullable: true
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        file_size:
          type: integer
          description: File size in bytes
          nullable: true
        file_format:
          type: string
          description: Audio file format (e.g., mp3, m4b)
          nullable: true
        bitrate:
          type: integer
          description: Audio bitrate in kbps
          nullable: true
        sample_rate:
          type: integer
          description: Audio sample rate in Hz
          nullable: true
        channels:
          type: integer
          description: Number of audio channels
          nullable: true
        reading_progress:
          type: object
          description: Current user's reading progress for this book
          nullable: true
          properties:
            progress:
              type: number
              format: float
              description: Reading progress (0-1)
            current_position:
              type: number
              format: float
              description: Current position in seconds
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
      example:
        id: "1"
        title: "Project Hail Mary"
        author: "Andy Weir"
        series: null
        seriesIndex: null
        narrator: "Ray Porter"
        duration: 35820
        coverPath: "/storage/covers/project-hail-mary.jpg"
        genres: ["Science Fiction", "Adventure"]
        description: "Ryland Grace is the sole survivor on a desperate, last-chance mission..."
        publishedYear: 2021
        created_at: "2025-01-01T12:00:00Z"
        updated_at: "2025-01-01T12:00:00Z"
        file_size: 524288000
        file_format: "m4b"
        bitrate: 64
        sample_rate: 44100
        channels: 2
        reading_progress: {
          "progress": 0.35,
          "current_position": 12537,
          "updated_at": "2025-01-15T09:30:00Z"
        }
        
    Author:
      type: object
      properties:
        id:
          type: string
          description: Author ID
        name:
          type: string
          description: Author name
        book_count:
          type: integer
          description: Number of books by this author
        genres:
          type: array
          items:
            type: string
          description: List of genres this author writes in
        series_count:
          type: integer
          description: Number of series by this author
        following:
          type: boolean
          description: Whether the current user is following this author
          nullable: true
        books:
          type: array
          items:
            $ref: '#/components/schemas/Book'
          description: Books by this author (only included in detailed responses)
          nullable: true
      example:
        id: "1"
        name: "Andy Weir"
        book_count: 3
        genres: ["Science Fiction", "Adventure"]
        series_count: 0
        following: true
        
    Series:
      type: object
      properties:
        id:
          type: string
          description: Series ID
        seriesName:
          type: string
          description: Series name
        book_count:
          type: integer
          description: Number of books in this series
        authors:
          type: array
          items:
            type: string
          description: List of authors who have written books in this series
        genres:
          type: array
          items:
            type: string
          description: List of genres this series belongs to
        following:
          type: boolean
          description: Whether the current user is following this series
          nullable: true
        books:
          type: array
          items:
            $ref: '#/components/schemas/Book'
          description: Books in this series (only included in detailed responses)
          nullable: true
      example:
        id: "1"
        seriesName: "The Expanse"
        book_count: 9
        authors: ["James S.A. Corey"]
        genres: ["Science Fiction", "Space Opera"]
        following: false
        
    Genre:
      type: object
      properties:
        id:
          type: string
          description: Genre ID
        name:
          type: string
          description: Genre name
        book_count:
          type: integer
          description: Number of books in this genre
        authors:
          type: array
          items:
            $ref: '#/components/schemas/Author'
          description: Authors who have books in this genre (only included in detailed responses)
          nullable: true
      example:
        id: "1"
        name: "Science Fiction"
        book_count: 250
        
    User:
      type: object
      properties:
        id:
          type: string
          description: User ID
        name:
          type: string
          description: User name
        email:
          type: string
          format: email
          description: User email
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        is_admin:
          type: boolean
          description: Whether the user is an admin
        book_count:
          type: integer
          description: Number of books the user has access to
          nullable: true
        last_login:
          type: string
          format: date-time
          description: Last login timestamp
          nullable: true
        preferences:
          type: object
          description: User preferences
          properties:
            theme:
              type: string
              description: UI theme preference
            notifications_enabled:
              type: boolean
              description: Whether notifications are enabled
            auto_download:
              type: boolean
              description: Whether auto-download is enabled
      example:
        id: "1"
        name: "John Doe"
        email: "john@example.com"
        created_at: "2025-01-01T12:00:00Z"
        updated_at: "2025-01-01T12:00:00Z"
        is_admin: false
        book_count: 150
        last_login: "2025-01-15T09:30:00Z"
        preferences:
          theme: "dark"
          notifications_enabled: true
          auto_download: false
          
    BookRequest:
      type: object
      properties:
        id:
          type: string
          description: Request ID
        title:
          type: string
          description: Requested book title
        author:
          type: string
          description: Requested book author
          nullable: true
        isbn:
          type: string
          description: ISBN of the requested book
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected, fulfilled]
          description: Current status of the request
        notes:
          type: string
          description: Additional notes from the requester
          nullable: true
        admin_notes:
          type: string
          description: Notes from admin (only visible to admins)
          nullable: true
        requester:
          type: object
          properties:
            id:
              type: string
              description: Requester user ID
            name:
              type: string
              description: Requester name
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        fulfilled_book_id:
          type: string
          description: ID of the book that fulfilled this request
          nullable: true
      example:
        id: "1"
        title: "Project Hail Mary"
        author: "Andy Weir"
        isbn: "9780593135204"
        status: "pending"
        notes: "I really enjoyed The Martian and would love to listen to this one too!"
        admin_notes: null
        requester:
          id: "2"
          name: "Jane Smith"
        created_at: "2025-01-15T09:30:00Z"
        updated_at: "2025-01-15T09:30:00Z"
        fulfilled_book_id: null
        
    Message:
      type: object
      properties:
        id:
          type: string
          description: Message ID
        subject:
          type: string
          description: Message subject
        content:
          type: string
          description: Message content
        read:
          type: boolean
          description: Whether the message has been read
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        related_book:
          type: object
          nullable: true
          properties:
            id:
              type: string
              description: Related book ID
            title:
              type: string
              description: Related book title
        related_request:
          type: object
          nullable: true
          properties:
            id:
              type: string
              description: Related request ID
            title:
              type: string
              description: Related request title
        recipients_count:
          type: integer
          description: Number of recipients (only for admin-sent messages)
          nullable: true
        sender:
          type: object
          nullable: true
          properties:
            id:
              type: string
              description: Sender user ID
            name:
              type: string
              description: Sender name
            is_admin:
              type: boolean
              description: Whether the sender is an admin
      example:
        id: "1"
