                    description: Book ID
                  progress:
                    type: number
                    format: float
                    description: Reading progress as a decimal between 0 and 1
                  last_position:
                    type: integer
                    description: Last position in seconds
                  last_updated:
                    type: string
                    format: date-time
                    description: When the progress was last updated
