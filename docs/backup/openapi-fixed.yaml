openapi: 3.0.3
info:
  title: Audiobook Librarian API
  description: |
    API documentation for the Audiobook Librarian application.
    
    This specification covers all endpoints available in the Audiobook Librarian API.
  version: 1.0.0
  contact:
    name: Audiobook Librarian Support
    email: support@audiobooklibrarian.example.com
servers:
  - url: /api/v1
    description: API v1
  - url: /admin
    description: Admin API

paths:
  # Authentication Endpoints
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account and returns an authentication token
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                password:
                  type: string
                  format: password
                  example: "securePassword123"
              required:
                - name
                - email
                - password
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT authentication token
                  user:
                    $ref: '#/components/schemas/User'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ"
                user:
                  id: 1
                  name: "John Doe"
                  email: "john.doe@example.com"
                  created_at: "2025-07-10T10:30:00.000000Z"
                  updated_at: "2025-07-10T10:30:00.000000Z"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: "The given data was invalid."
                errors:
                  email: ["The email has already been taken."]
                  password: ["The password must be at least 8 characters."]

  /login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticates a user and returns a token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                password:
                  type: string
                  format: password
                  example: "securePassword123"
              required:
                - email
                - password
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT authentication token
                  user:
                    $ref: '#/components/schemas/User'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ"
                user:
                  id: 1
                  name: "John Doe"
                  email: "john.doe@example.com"
                  created_at: "2025-07-10T10:30:00.000000Z"
                  updated_at: "2025-07-10T10:30:00.000000Z"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unauthorized"
                message: "Invalid credentials"
                status_code: 401

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidates the user's authentication token
      operationId: logoutUser
      responses:
        '200':
          description: User logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Successfully logged out"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unauthorized"
                message: "Unauthenticated"
                status_code: 401
      security:
        - bearerAuth: []

  # User Endpoints
  /user:
    get:
      tags:
        - User
      summary: Get current user
      description: Returns the currently authenticated user's details
      operationId: getCurrentUser
      responses:
        '200':
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                name: "John Doe"
                email: "john.doe@example.com"
                created_at: "2025-07-10T10:30:00.000000Z"
                updated_at: "2025-07-10T10:30:00.000000Z"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unauthorized"
                message: "Unauthenticated"
                status_code: 401
      security:
        - bearerAuth: []

  /me:
    get:
      tags:
        - User
      summary: Get current user (alias)
      description: Alias for /user endpoint
      operationId: getCurrentUserAlias
      responses:
        '200':
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                name: "John Doe"
                email: "john.doe@example.com"
                created_at: "2025-07-10T10:30:00.000000Z"
                updated_at: "2025-07-10T10:30:00.000000Z"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unauthorized"
                message: "Unauthenticated"
                status_code: 401
      security:
        - bearerAuth: []

  # Series Autocomplete Endpoints
  /series/autocomplete:
    get:
      tags:
        - Series
      summary: Series name autocomplete
      description: |
        Returns fuzzy, prefix-matched series names using Atlas Search autocomplete aggregation on the `seriesName` field.
        This endpoint supports partial matching and handles typos gracefully.
      operationId: seriesAutocomplete
      parameters:
        - name: query
          in: query
          description: The search string for the series name
          required: true
          schema:
            type: string
            example: "Super"
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
            example: 5
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                example:
                  data: ["Super Powereds", "Super Heroes", "Superman", "Supergirl", "Supernatural"]
              examples:
                fullMatch:
                  summary: Full match results
                  value:
                    data: ["Super Powereds", "Super Heroes", "Superman", "Supergirl", "Supernatural"]
                partialMatch:
                  summary: Partial match results
                  value:
                    data: ["Mistborn", "Mist Born", "Mistwalker"]
                emptyResults:
                  summary: No matches found
                  value:
                    data: []
        '400':
          description: Bad request - missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Bad Request"
                message: "Missing required parameter: query"
                status_code: 400
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unauthorized"
                message: "Authentication required"
                status_code: 401
      security:
        - bearerAuth: []
        
  # Book Endpoints
  /books:
    get:
      tags:
        - Books
      summary: List books
      description: Returns a paginated list of books with optional filtering
      operationId: listBooks
      parameters:
        - name: query
          in: query
          description: Search string (matches title, author, or series)
          required: false
          schema:
            type: string
            example: "dragon"
        - name: author_id
          in: query
          description: Filter by author ID
          required: false
          schema:
            type: string
            example: "123"
        - name: author
          in: query
          description: Filter by author name
          required: false
          schema:
            type: string
            example: "Brandon Sanderson"
        - name: series_id
          in: query
          description: Filter by series ID
          required: false
          schema:
            type: string
            example: "456"
        - name: series
          in: query
          description: Filter by series name
          required: false
          schema:
            type: string
            example: "Mistborn"
        - name: genre_id
          in: query
          description: Filter by genre ID
          required: false
          schema:
            type: string
            example: "789"
        - name: genre
          in: query
          description: Filter by genre name
          required: false
          schema:
            type: string
            example: "Fantasy"
        - name: published_year
          in: query
          description: Filter by publication year
          required: false
          schema:
            type: integer
            example: 2020
        - name: date_added
          in: query
          description: Filter by date the book was added
          required: false
          schema:
            type: string
            format: date
            example: "2025-07-01"
        - name: with_cover
          in: query
          description: Include cover info
          required: false
          schema:
            type: boolean
            default: true
            example: true
        - name: inlineCovers
          in: query
          description: Return base64-encoded cover images instead of URLs
          required: false
          schema:
            type: boolean
            default: false
            example: false
        - name: per_page
          in: query
          description: Results per page
          required: false
          schema:
            type: integer
            default: 100
            example: 20
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
            example: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:

                  - {
                    "id": 1,
                    "title": "The Way of Kings",
                    "author": {
                      "id": 1,
                      "name": "Brandon Sanderson"
                    },
                    "series": [
                      {
                        "seriesName": "The Stormlight Archive",
                        "number": "1"
                      }
                    ],
                    "cover_url": "/api/v1/books/1/cover",
                    "download_url": "/api/v1/books/1/download",
                    "genres": ["Fantasy", "Epic"],
                    "description": "Roshar is a world of stone and storms...",
                    "duration": 45720
                  }
      - {
                    "id": 2,
                    "title": "Words of Radiance",
                    "author": {
                      "id": 1,
                      "name": "Brandon Sanderson"
                    },
                    "series": [
                      {
                        "seriesName": "The Stormlight Archive",
                        "number": "2"
                      }
                    ],
                    "cover_url": "/api/v1/books/2/cover",
                    "download_url": "/api/v1/books/2/download",
                    "genres": ["Fantasy", "Epic"],
                    "description": "Expected by his enemies to die...",
                    "duration": 48330
                  }
                ],
                meta:

                  {
                  "current_page": 1,
                  "last_page": 10,
                  "per_page": 20,
                  "total": 200,
                  "from": 1,
                  "to": 20,
                  "path": "/api/v1/books",
                  "links": {
                    "first": "/api/v1/books?page=1",
                    "last": "/api/v1/books?page=10",
                    "prev": null,
                    "next": "/api/v1/books?page=2"
                  }
                }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unauthorized"
                message: "Unauthenticated"
                status_code: 401
      security:
        - bearerAuth: []
        
  /books/{book}:
    get:
      tags:
        - Books
      summary: Get book details
      description: Returns detailed information about a specific book
      operationId: getBook
      parameters:
        - name: book
          in: path
          description: Book ID
          required: true
          schema:
            type: string
            example: "1"
        - name: with_cover
          in: query
          description: Include cover info
          required: false
          schema:
            type: boolean
            default: true
            example: true
        - name: inlineCovers
          in: query
          description: Return base64-encoded cover image instead of URL
          required: false
          schema:
            type: boolean
            default: false
            example: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
              example:
                id: 1
                title: "The Way of Kings"
                author: {
                  "id": 1,
                  "name": "Brandon Sanderson"
                }
                series:

                  - {
                    "seriesName": "The Stormlight Archive",
                    "number": "1"
                  }
                ]
                cover_url: "/api/v1/books/1/cover"
                download_url: "/api/v1/books/1/download"
                genres: ["Fantasy", "Epic"]
                description: "Roshar is a world of stone and storms..."
                duration: 45720
                published_year: 2010
                narrator: "Michael Kramer and Kate Reading"
                publisher: "Macmillan Audio"
                language: "English"
                format: "m4b"
                file_size: 524288000
                date_added: "2025-01-15T10:30:00.000000Z"
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Not Found"
                message: "Book not found"
                status_code: 404
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unauthorized"
                message: "Unauthenticated"
                status_code: 401
      security:
        - bearerAuth: []
        
  /books/{book}/cover:
    get:
      tags:
        - Books
      summary: Get book cover image
      description: Returns the cover image for a specific book
      operationId: getBookCover
      parameters:
        - name: book
          in: path
          description: Book ID
          required: true
          schema:
            type: string
            example: "1"
      responses:
        '200':
          description: Cover image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Cover image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Not Found"
                message: "Cover image not found"
                status_code: 404
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        
  /books/{book}/download:
    get:
      tags:
        - Books
      summary: Download book audio file
      description: Returns the audio file for a specific book (requires permission)
      operationId: downloadBook
      parameters:
        - name: book
          in: path
          description: Book ID
          required: true
          schema:
            type: string
            example: "1"
      responses:
        '200':
          description: Audio file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/mp4:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Forbidden"
                message: "You do not have permission to download this book"
                status_code: 403
        '404':
          description: Book audio file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Not Found"
                message: "Audio file not found"
                status_code: 404
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        
  /books/browse:
    get:
      tags:
        - Books
      summary: Browse books by genre/author/series
      description: Returns a paginated list of genres, authors, or series for browsing
      operationId: browseBooks
      parameters:
        - name: type
          in: query
          description: Type of items to browse
          required: true
          schema:
            type: string
            enum: ["genre", "author", "series"]
            example: "genre"
        - name: search
          in: query
          description: Filter items by name
          required: false
          schema:
            type: string
            example: "fantasy"
        - name: per_page
          in: query
          description: Results per page
          required: false
          schema:
            type: integer
            default: 100
            example: 20
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
            example: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/Genre'
                        - $ref: '#/components/schemas/Author'
                        - $ref: '#/components/schemas/Series'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                genres:
                  summary: Browse by genre
                  value:
                    data:

                      - {
                        "id": "1",
                        "name": "Fantasy",
                        "book_count": 120
                      }
      - {
                        "id": "2",
                        "name": "Science Fiction",
                        "book_count": 85
                      }
      - {
                        "id": "3",
                        "name": "Mystery",
                        "book_count": 64
                      }
                    ],
                    meta:

                      {
                      "current_page": 1,
                      "last_page": 2,
                      "per_page": 20,
                      "total": 25,
                      "from": 1,
                      "to": 20,
                      "path": "/api/v1/books/browse",
                      "links": {
                        "first": "/api/v1/books/browse?page=1",
                        "last": "/api/v1/books/browse?page=2",
                        "prev": null,
                        "next": "/api/v1/books/browse?page=2"
                      }
                    }
                authors:
                  summary: Browse by author
                  value:
                    data:

                      - {
                        "id": "1",
                        "name": "Brandon Sanderson",
                        "book_count": 15
                      }
      - {
                        "id": "2",
                        "name": "J.K. Rowling",
                        "book_count": 10
                      }
      - {
                        "id": "3",
                        "name": "Stephen King",
                        "book_count": 25
                      }
                    ],
                    meta:

                      {
                      "current_page": 1,
                      "last_page": 10,
                      "per_page": 20,
                      "total": 200,
                      "from": 1,
                      "to": 20,
                      "path": "/api/v1/books/browse",
                      "links": {
                        "first": "/api/v1/books/browse?page=1",
                        "last": "/api/v1/books/browse?page=10",
                        "prev": null,
                        "next": "/api/v1/books/browse?page=2"
                      }
                    }
                series:
                  summary: Browse by series
                  value:
                    data:

                      - {
                        "id": "1",
                        "seriesName": "The Stormlight Archive",
                        "book_count": 4
                      }
      - {
                        "id": "2",
                        "seriesName": "Harry Potter",
                        "book_count": 7
                      }
      - {
                        "id": "3",
                        "seriesName": "The Dark Tower",
                        "book_count": 8
                      }
                    ],
                    meta:

                      {
                      "current_page": 1,
                      "last_page": 5,
                      "per_page": 20,
                      "total": 100,
                      "from": 1,
                      "to": 20,
                      "path": "/api/v1/books/browse",
                      "links": {
                        "first": "/api/v1/books/browse?page=1",
                        "last": "/api/v1/books/browse?page=5",
                        "prev": null,
                        "next": "/api/v1/books/browse?page=2"
                      }
                    }
        '400':
          description: Bad request - invalid type parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Bad Request"
                message: "Invalid type parameter. Must be one of: genre, author, series"
                status_code: 400
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        
  /books/search:
    get:
      tags:
        - Books
      summary: Advanced search for books
      description: Returns a paginated list of books matching the search criteria
      operationId: searchBooks
      parameters:
        - name: title
          in: query
          description: Filter by book title
          required: false
          schema:
            type: string
            example: "king"
        - name: author
          in: query
          description: Filter by author name
          required: false
          schema:
            type: string
            example: "Sanderson"
        - name: series
          in: query
          description: Filter by series name
          required: false
          schema:
            type: string
            example: "Stormlight"
        - name: genre
          in: query
          description: Filter by genre name
          required: false
          schema:
            type: string
            example: "Fantasy"
        - name: published_year
          in: query
          description: Filter by publication year
          required: false
          schema:
            type: integer
            example: 2020
        - name: date_added
          in: query
          description: Filter by date added
          required: false
          schema:
            type: string
            format: date
            example: "2025-01-01"
        - name: with_cover
          in: query
          description: Include cover info
          required: false
          schema:
            type: boolean
            default: true
            example: true
        - name: inlineCovers
          in: query
          description: Return base64-encoded cover images instead of URLs
          required: false
          schema:
            type: boolean
            default: false
            example: false
        - name: per_page
          in: query
          description: Results per page
          required: false
          schema:
            type: integer
            default: 100
            example: 20
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
            example: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - id: 1
                    title: "The Way of Kings"
                    author:
                      id: 1
                      name: "Brandon Sanderson"
                    series:
                      - seriesName: "The Stormlight Archive"
                        number: "1"
                    cover_url: "/api/v1/books/1/cover"
                    download_url: "/api/v1/books/1/download"
                    genres: ["Fantasy", "Epic"]
                    description: "Roshar is a world of stone and storms..."
                    duration: 45720
                  - id: 2
                    title: "The Name of the Wind"
                    author:
                      id: 2
                      name: "Patrick Rothfuss"
                    series:
                      - seriesName: "The Kingkiller Chronicle"
                        number: "1"
                    cover_url: "/api/v1/books/2/cover"
                    download_url: "/api/v1/books/2/download"
                    genres: ["Fantasy", "Adventure"]
                    description: "This is a story about a man named Kvothe..."
                    duration: 34200
                meta:

                  {
                  "current_page": 1,
                  "last_page": 1,
                  "per_page": 20,
                  "total": 1,
                  "from": 1,
                  "to": 1,
                  "path": "/api/v1/books/search",
                  "links": {
                    "first": "/api/v1/books/search?page=1",
                    "last": "/api/v1/books/search?page=1",
                    "prev": null,
                    "next": null
                  }
                }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        
  # Author Endpoints
