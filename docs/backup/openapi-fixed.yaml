  /admin/books/import:
    post:
      tags:
        - Admin
        - Books
      summary: Import books (admin)
      description: Imports books from a file or external source (admin only)
      operationId: adminImportBooks
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                import_file:
                  type: string
                  format: binary
                  description: CSV or JSON file with book data
                import_type:
                  type: string
                  enum: [csv, json, audible, goodreads]
                  description: Type of import
                  example: "csv"
                options:
                  type: object
                  properties:
                    skip_existing:
                      type: boolean
                      description: Skip existing books
                      example: true
                    download_covers:
                      type: boolean
                      description: Download cover images
                      example: true
      responses:
        '200':
          description: Import started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  import_id:
                    type: string
                    description: Import job ID for status checking
                  estimated_completion:
                    type: string
                    format: date-time
                    description: Estimated completion time
              example:
                message: "Import started successfully"
                import_id: "imp_123456"
                estimated_completion: "2025-01-15T15:30:00Z"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: "The given data was invalid."
                errors:
                  import_file: ["The import file is required."]
                  import_type: ["The selected import type is invalid."]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - User is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Forbidden"
                message: "You do not have permission to import books"
                status_code: 403
      security:
        - bearerAuth: []
        
  /admin/books/import/{import_id}:
    get:
      tags:
        - Admin
        - Books
      summary: Get import status (admin)
      description: Returns the status of a book import job (admin only)
      operationId: adminGetImportStatus
      parameters:
        - name: import_id
          in: path
          description: Import job ID
          required: true
          schema:
            type: string
            example: "imp_123456"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  import_id:
                    type: string
                    description: Import job ID
                  status:
                    type: string
                    enum: [pending, processing, completed, failed]
                    description: Import status
                  progress:
                    type: number
                    format: float
                    description: Import progress (0-1)
                  total_items:
                    type: integer
                    description: Total number of items to import
                  processed_items:
                    type: integer
                    description: Number of items processed
                  successful_items:
                    type: integer
                    description: Number of items successfully imported
                  failed_items:
                    type: integer
                    description: Number of items that failed to import
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        item:
                          type: string
                          description: Item identifier
                        error:
                          type: string
                          description: Error message
                  started_at:
                    type: string
                    format: date-time
                    description: When the import started
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the import completed
              example:
                import_id: "imp_123456"
                status: "processing"
                progress: 0.65
                total_items: 100
                processed_items: 65
                successful_items: 62
                failed_items: 3
                errors:

                  - {
                    "item": "row_45",
                    "error": "Invalid author name format"
                  }
      - {
                    "item": "row_52",
                    "error": "Missing required title field"
                  }
      - {
                    "item": "row_60",
                    "error": "Duplicate ISBN"
                  }
                ]
                started_at: "2025-01-15T14:30:00Z"
                completed_at: null
        '404':
          description: Import job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Not Found"
                message: "Import job not found"
                status_code: 404
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - User is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Forbidden"
                message: "You do not have permission to view import status"
                status_code: 403
      security:
        - bearerAuth: []
        
  # Batch Download Endpoints
  /books/queue/download:
    post:
      tags:
        - Books
      summary: Queue multiple books for download
      description: Creates a zip file containing multiple books for download
      operationId: queueDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_ids:
                  type: array
                  items:
                    type: string
                  description: Array of book IDs to include in the download
                  example: ["1", "2", "3"]
      responses:
        '200':
          description: Download queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  zip_id:
                    type: string
                    description: ID of the queued zip file
                  status:
                    type: string
                    enum: [pending, processing, completed, failed]
                    description: Current status of the zip creation
              example:
                message: "Download queued successfully"
                zip_id: "zip_123456"
                status: "processing"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: "The given data was invalid."
                errors:
                  book_ids: ["The book_ids field is required."]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        
  /books/queue/download/{zipId}:
    get:
      tags:
        - Books
      summary: Download queued zip file
      description: Downloads a previously queued zip file containing multiple books
      operationId: downloadQueuedZip
      parameters:
        - name: zipId
          in: path
          description: ID of the queued zip file
          required: true
          schema:
            type: string
            example: "zip_123456"
      responses:
        '200':
          description: Successful operation
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          description: Zip file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Not Found"
                message: "Zip file not found"
                status_code: 404
        '202':
          description: Zip file is still being generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Status message
                  status:
                    type: string
                    enum: [pending, processing]
                    description: Current status of the zip creation
                  progress:
                    type: number
                    format: float
                    description: Progress percentage (0-1)
              example:
                message: "Zip file is still being generated"
                status: "processing"
                progress: 0.75
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        
