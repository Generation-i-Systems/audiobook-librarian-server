        content: "Good news! Your request for 'Project Hail Mary' has been approved and will be added to the library soon."
        read: false
        created_at: "2025-01-15T14:30:00Z"
        related_book: null
        related_request:
          id: "1"
          title: "Project Hail Mary"
        recipients_count: null
        sender:
          id: "3"
          name: "Admin User"
          is_admin: true
        
    ReadingProgress:
      type: object
      properties:
        book_id:
          type: string
          description: Book ID
        user_id:
          type: string
          description: User ID
        progress:
          type: number
          format: float
          description: Reading progress (0-1)
        current_position:
          type: number
          format: float
          description: Current position in seconds
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        book_details:
          type: object
          nullable: true
          properties:
            title:
              type: string
              description: Book title
            author:
              type: string
              description: Book author
            coverPath:
              type: string
              description: Path to cover image
      example:
        book_id: "1"
        user_id: "2"
        progress: 0.75
        current_position: 26865
        updated_at: "2025-01-15T09:30:00Z"
        book_details:
          title: "Project Hail Mary"
          author: "Andy Weir"
          coverPath: "/storage/covers/project-hail-mary.jpg"
        
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error type
        message:
          type: string
          description: Error message
        status_code:
          type: integer
          description: HTTP status code
      example:
        error: "Not Found"
        message: "Resource not found"
        status_code: 404
        
    ValidationError:
      type: object
      properties:
        message:
          type: string
          description: Error message
        errors:
          type: object
          description: Validation errors by field
          additionalProperties:
            type: array
            items:
              type: string
      example:
        message: "The given data was invalid."
        errors:
          title: ["The title field is required."]
          author: ["The author field is required."]
          
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          description: Current page number
        last_page:
          type: integer
          description: Last page number
        per_page:
          type: integer
          description: Items per page
        total:
          type: integer
          description: Total number of items
        from:
          type: integer
          description: First item index on current page
        to:
          type: integer
          description: Last item index on current page
        path:
          type: string
          description: Base path for pagination links
        links:
          type: object
          properties:
            first:
              type: string
              description: Link to first page
            last:
              type: string
              description: Link to last page
            prev:
              type: string
              nullable: true
              description: Link to previous page
            next:
              type: string
              nullable: true
              description: Link to next page
      example:
        current_page: 2
        last_page: 5
        per_page: 20
        total: 100
        from: 21
        to: 40
        path: "/api/v1/books"
        links:
          first: "/api/v1/books?page=1"
          last: "/api/v1/books?page=5"
          prev: "/api/v1/books?page=1"
          next: "/api/v1/books?page=3"
          
    ZipDownload:
      type: object
      properties:
        zip_id:
          type: string
          description: Zip file ID
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Current status of the zip creation
        progress:
          type: number
          format: float
          description: Progress percentage (0-1)
        book_count:
          type: integer
          description: Number of books in the zip file
        total_size:
          type: integer
          description: Total size of the zip file in bytes
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        completed_at:
          type: string
          format: date-time
          description: Completion timestamp
          nullable: true
        downloaded:
          type: boolean
          description: Whether the zip file has been downloaded
        expires_at:
          type: string
          format: date-time
          description: Expiration timestamp
      example:
        zip_id: "zip_123456"
        status: "completed"
        progress: 1.0
        book_count: 3
        total_size: 1572864000
        created_at: "2025-01-15T14:30:00Z"
        completed_at: "2025-01-15T14:35:00Z"
        downloaded: false
        expires_at: "2025-01-22T14:30:00Z"
        
    ValidationError:
      type: object
      properties:
        message:
          type: string
          description: Error message
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Validation errors by field
      example:
        message: "The given data was invalid."
        errors:
          email: ["The email field is required."]
          password: ["The password must be at least 8 characters."]
      required:
        - message
        - errors

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token authentication.
        Example: `Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...`
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Admin authentication required.
        The JWT token must contain an admin role claim.
        Example: `Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...`
